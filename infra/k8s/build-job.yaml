apiVersion: batch/v1
kind: Job
metadata:
  name: momento-android-build
  namespace: momento
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: android-build
          image: momento-android-build:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Dfile.encoding=UTF-8"
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
