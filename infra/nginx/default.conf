server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    charset utf-8;

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    location /apk/ {
        autoindex on;
        add_header Content-Type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="momento.apk"';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
